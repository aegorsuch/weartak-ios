name: iOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Run portable Garmin checks
        shell: bash
        run: bash scripts/run-portable-garmin-checks.sh

      - name: Build Companion and Watch app for iOS Simulator
        run: |
          xcodebuild \
            -project WearTAK.xcodeproj \
            -scheme "WearTAK Companion" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: WearTAK-simulator
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/WearTAK.app
          if-no-files-found: error
          retention-days: 7
