stages:
  - verify
  - publish
  - app_review

default:
  tags:
    - macos

variables:
  DERIVED_DATA_PATH: "$CI_PROJECT_DIR/build/DerivedData"

verify:
  stage: verify
  script:
    - node --test Tests/app-store-review.test.mjs
    - bash scripts/run-portable-garmin-checks.sh
    - xcodebuild -project WearTAK.xcodeproj -scheme "WearTAK Companion" -destination "generic/platform=iOS Simulator" -derivedDataPath "$DERIVED_DATA_PATH" EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/WearTAK.app

app_store_connect_upload:
  stage: publish
  needs:
    - verify
  resource_group: app-store-connect
  script:
    - bash scripts/release-app-store-connect.sh
  artifacts:
    when: always
    name: "WearTAK-iOS-$CI_COMMIT_TAG-p$CI_PIPELINE_IID"
    expire_in: 30 days
    paths:
      - build/app-store-connect-output.*/WearTAK*.ipa
      - build/app-store-connect-output.*/WearTAK*.ipa.sha256
      - build/app-store-connect-output.*/WearTAK*.xcarchive/
      - build/app-store-connect-upload.json
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-testflight\.[1-9][0-9]*)?$/'
      when: manual
      allow_failure: true

app_store_review_submit:
  stage: app_review
  needs:
    - job: app_store_connect_upload
      artifacts: true
  resource_group: app-store-connect
  variables:
    APP_STORE_UPLOAD_RECEIPT: "$CI_PROJECT_DIR/build/app-store-connect-upload.json"
  script:
    - node scripts/app-store-review.mjs submit
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-testflight\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
